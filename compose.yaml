services:
  redis:
    image: redis:8
    container_name: backend-standalone-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6384:6379"
    volumes:
      - redis-data:/data
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
